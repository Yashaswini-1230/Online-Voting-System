{% extends 'base.html' %}

{% block content %}

<div class="container">

```
<h2>Admin Results</h2>

{% if candidates %}

    {% for candidate in candidates %}

    <div class="candidate-card">

        <h3>{{ candidate.name }}</h3>

        <p>
            Party : {{ candidate.party }}
        </p>

        <p>
            Votes : {{ candidate.votes }}
        </p>

    </div>

    {% endfor %}

{% else %}

    <div class="empty-results">

        <h3>No Candidates Available</h3>

    </div>

{% endif %}
```

</div>

{% endblock %}
