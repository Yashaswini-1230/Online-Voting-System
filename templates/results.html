{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Admin Results</h2>

    {% for candidate in candidates %}

        <div class="candidate-card">

            <h3>
                {{ candidate.name }}
            </h3>

            <p>
                Votes :
                {{ candidate.votes }}
            </p>

        </div>

    {% endfor %}

</div>

{% endblock %}
