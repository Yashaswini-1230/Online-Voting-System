{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Create Account</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="Email Address"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">
            Register
        </button>
        <div class="auth-switch">

    Already have an account?

    <a href="/login">

        Login Here

    </a>

</div>

    </form>

</div>

{% endblock %}
